<!doctype html>
<html lang="ko">
<head>
<title>다른 하나 찾기</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#151D2B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="다른 하나">
<link rel="manifest" href="app.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
  [hidden]{display:none!important}
  html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  :root{
    color-scheme: dark;
    --felt:#1F2A3C;
    --felt-deep:#151D2B;
    --bar:#101724;
    --ink:#ECE5D3;
    --ink-dim:#A3AEC2;
    --brass:#D8A445;
    --brass-ink:#2A1D06;
    --line:rgba(236,229,211,.14);
    --chip:rgba(236,229,211,.06);
  }
  html{box-sizing:border-box;height:100%}
  *,*::before,*::after{box-sizing:inherit}
  body{
    height:100%;margin:0;overflow:hidden;overscroll-behavior:none;
    background:var(--felt-deep);color:var(--ink);
    font:400 15px/1.4 "IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  }
  .app{position:relative;height:100%}
  /* 화면이 세로면 게임 화면 전체를 90도 돌려 세로 화면을 꽉 채운다 — 태블릿을 옆으로 돌려 들면 가로 화면처럼 보임 (자동회전 꺼도 됨) */
  @media (orientation:portrait){
    .app{position:fixed;top:0;left:100vw;width:100vh;height:100vw;transform-origin:0 0;transform:rotate(90deg)}
  }
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:58px;padding:0 18px;
    border-radius:12px;border:1px solid var(--line);background:var(--chip);color:var(--ink);
    font-family:inherit;font-size:19px;font-weight:500;line-height:1.2;cursor:pointer;touch-action:manipulation;white-space:nowrap;
  }
  .btn:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
  .btn.primary{background:var(--brass);color:var(--brass-ink);border-color:transparent;font-weight:700}
  .btn[aria-pressed="true"]{background:rgba(216,164,69,.16);border-color:var(--brass);color:var(--brass)}
  .seg{display:flex;align-items:center;gap:6px}
  .seg .lbl{color:var(--ink-dim);font-size:17px;padding-right:2px;white-space:nowrap}
  .seg .btn{flex:1 1 0;min-width:0;padding:0 4px;font-size:18px}
  .seg .btn[aria-pressed="true"]{background:var(--brass);color:var(--brass-ink);border-color:transparent;font-weight:700}
  .stage{position:absolute;inset:0;background:var(--felt)}
  .top{position:absolute;left:16px;top:12px;right:150px;display:flex;align-items:center;gap:14px;min-height:54px}
  .prog{font-size:20px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
  .prog b{color:var(--brass);font-size:24px}
  .ask{font-size:22px;font-weight:700}
  .stars{display:flex;gap:6px;flex-wrap:wrap}
  .stars i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink-dim)}
  .stars i.ok{background:var(--brass);border-color:var(--brass)}
  .stars i.slow{background:#A3AEC2;border-color:#A3AEC2}
  .gear{
    position:absolute;right:12px;top:12px;min-height:54px;padding:0 22px;font-size:20px;font-weight:700;z-index:2;
    background:var(--brass);color:var(--brass-ink);border-color:transparent;box-shadow:0 4px 14px rgba(0,0,0,.45)
  }
  /* 영상 퀴즈처럼 한 판에 같은 그림을 가득 늘어놓는다 — 밝은 판 위에 그림만 */
  /* 확대하면 판(grid)이 커지고, 보이는 창(view) 밖은 가린다 */
  .view{position:absolute;overflow:hidden;border-radius:18px;box-shadow:0 8px 24px rgba(0,0,0,.35);touch-action:none}
  .grid{position:absolute;left:0;top:0;display:grid;gap:var(--gap);padding:var(--gap);background:#F4ECD8;transform-origin:0 0}
  .view .cell{touch-action:none}
  .unzoom{margin-left:auto;min-height:48px;padding:0 18px;font-size:19px;font-weight:700;background:var(--brass);color:var(--brass-ink);border-color:transparent}
  /* 칸은 화면에 맞춰 가로로 길 수도 있다 — 그림(--s)은 칸 가운데, 동그라미는 그림 둘레 */
  .cell{
    position:relative;display:grid;place-items:center;border:0;background:transparent;cursor:pointer;
    touch-action:manipulation;padding:0;line-height:1
  }
  .cell img{width:var(--s);height:var(--s);object-fit:contain;display:block;pointer-events:none}
  .cell::after{
    content:'';position:absolute;left:50%;top:50%;width:calc(var(--s) + 12px);height:calc(var(--s) + 12px);
    transform:translate(-50%,-50%);border-radius:50%;border:5px solid transparent;pointer-events:none
  }
  .cell.right::after{border-color:#E0336E}
  .cell.wrong{animation:shake .4s}
  .cell.hint::after{border-color:#E0A21B;border-style:dashed}
  @keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  @media (prefers-reduced-motion:reduce){ .cell.wrong{animation:none} .cell.wrong::after{border-color:#C25A45} }
  .veil{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:rgba(8,12,20,.55);overflow:auto;z-index:3}
  .card{
    width:min(100%,460px);padding:26px 24px 24px;border-radius:18px;
    background:var(--bar);border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.5);
    display:flex;flex-direction:column;gap:18px
  }
  .card h2{margin:0;font-family:"Do Hyeon","IBM Plex Sans KR",sans-serif;font-weight:400;font-size:44px;line-height:1;color:var(--brass)}
  .card h3{margin:0;font-family:"Do Hyeon","IBM Plex Sans KR",sans-serif;font-weight:400;font-size:30px;line-height:1;color:var(--brass)}
  .card .big{margin:0;font-size:26px;font-weight:700}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid2 .wide{grid-column:1 / -1}
  .note{margin:0;color:var(--ink-dim);font-size:15px}
</style>
</head>
<body>

<div class="app">
  <main class="stage" id="stage">
    <div class="top">
      <span class="prog"><b id="qn">1</b> / <span id="qt">10</span></span>
      <span class="ask">하나만 다른 그림을 눌러요</span>
      <div class="stars" id="stars"></div>
      <button id="unzoom" class="btn unzoom" type="button" hidden>원래 크기</button>
    </div>
    <div class="view" id="view"><div class="grid" id="grid" role="grid" aria-label="그림"></div></div>
    <button id="gear" class="btn gear" type="button">설정</button>

    <div class="veil" id="menu" hidden>
      <div class="card" role="dialog" aria-label="설정">
        <h3>설정</h3>
        <div class="grid2">
          <div id="level" class="seg wide" role="group" aria-label="난이도">
            <button class="btn" type="button" data-v="1" aria-pressed="true">쉬움</button>
            <button class="btn" type="button" data-v="2" aria-pressed="false">보통</button>
            <button class="btn" type="button" data-v="3" aria-pressed="false">어려움</button>
          </div>
          <div id="count" class="seg wide" role="group" aria-label="문제 수">
            <span class="lbl">문제</span>
            <button class="btn" type="button" data-v="5" aria-pressed="false">5개</button>
            <button class="btn" type="button" data-v="10" aria-pressed="true">10개</button>
            <button class="btn" type="button" data-v="20" aria-pressed="false">20개</button>
          </div>
          <button id="sound" class="btn" type="button" aria-pressed="true">소리</button>
          <button id="again" class="btn" type="button">처음부터</button>
          <button id="full" class="btn wide" type="button">전체 화면</button>
        </div>
        <p class="note">40개(8×5) 중에서 하나만 다른 그림을 찾아요. 표정·기울기·크기·색이 아주 조금 달라요. 어려울수록 더 비슷해요. 틀리면 흔들리고, 두 번 틀리면 노란 점선으로 알려 줘요.</p>
        <button id="menuClose" class="btn primary" type="button">닫고 하기</button>
      </div>
    </div>

    <div class="veil" id="done" hidden>
      <div class="card">
        <h2>잘하셨어요!</h2>
        <p class="big" id="dScore"></p>
        <button id="doneAgain" class="btn primary" type="button">한 번 더 하기</button>
      </div>
    </div>
  </main>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const stage = $('#stage'), grid = $('#grid');
  const PREFS = 'odd.prefs';
  // 문제 종류: 비슷한 두 그림 / 색만 다른 그림 / 방향만 다른 그림
  const PAIRS = [['🍎','🍏'],['🐶','🐱'],['🌻','🌼'],['🚗','🚕'],['⭐','🌟'],['🍊','🍋'],['🐟','🐠'],['🌙','⭐'],
    ['🍓','🍒'],['🐔','🐤'],['🌷','🌹'],['🍉','🍈'],['🐢','🐸'],['🚌','🚎'],['🏠','🏡'],['☀️','🌞'],['🍇','🫐'],['🐰','🐹'],
    ['🎈','🎀'],['☂️','🌂'],['🍞','🥐'],['🐮','🐷'],['🌳','🌲'],['🦆','🐓'],['⚽','🏀'],['🍌','🌽']];
  const SOLO = ['🍎','🐟','🚗','🌻','🐤','🎈','🐢','🍓','🦋','🐌','🌷','🍉','🐦','🍄','🐝'];
  // 방향이 있는 그림 (좌우로 뒤집으면 달라 보이는 것)
  const FACING = ['🐟','🚗','🐌','🐤','🐦','🦆','🐢','🚌','🐓','🐕','🐎','✈️','🚜'];
  // 비슷한 얼굴 짝 — 표정이 조금 다른 것(mid)과 눈·입 모양 하나만 다른 것(hard)
  const FACES_MID = [['😆','😁'],['😊','😌'],['🙂','🙃'],['🙂','😊'],['😶','😐'],['😢','😥'],['😲','😮'],['😴','😪'],['😷','🤒'],
    ['😸','😹'],['😼','😺'],['🙀','😿'],['😠','😡'],['🌝','🌚'],['🌗','🌓'],['🐭','🐹'],['🐻','🐨']];
  const FACES_HARD = [['😀','😃'],['😃','😄'],['😁','😄'],['😗','😙'],['😚','😙'],['😧','😦'],['😮','😯'],['😟','🙁'],['🙁','😕'],
    ['😐','😑'],['😒','😑'],['😔','😞'],['😥','😰'],['😺','😸'],['🌕','🌖'],['😀','😁'],['😊','☺️'],['😙','😗']];
  const CLOCKS = ['🕐','🕑','🕒','🕓','🕔','🕕','🕖','🕗','🕘','🕙','🕚','🕛'];
  // 판은 모두 8×5(40개) — 그림을 크게. 난이도는 다른 그림이 얼마나 비슷한지로
  //  turn: 기울인 각도, hue: 색 바꾸는 정도, size: 크기 — 숫자가 작을수록 알아보기 어렵다
  const LEVEL = {
    1: { cols: 8, rows: 5, hue: 40, turn: 20, size: .84, kinds: ['mid', 'mid', 'hard', 'flip', 'turn'] },
    2: { cols: 8, rows: 5, hue: 28, turn: 14, size: .88, kinds: ['hard', 'hard', 'mid', 'clock', 'turn', 'color', 'size'] },
    3: { cols: 8, rows: 5, hue: 18, turn: 9,  size: .92, kinds: ['hard', 'hard', 'hard', 'clock', 'turn', 'color', 'size'] }
  };

  const store = {
    get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
    set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
  };
  let prefs = { level: 1, count: 10, sound: true };
  try { Object.assign(prefs, JSON.parse(store.get(PREFS) || '{}')); } catch(e){}
  const savePrefs = () => store.set(PREFS, JSON.stringify(prefs));
  const pick = a => a[Math.floor(Math.random()*a.length)];
  // 그림 글자를 이미지로 바꿔 쓴다 — 큰 그림 글자는 화면을 돌리면 반쯤 잘려 보이는 기기가 있어서
  const pics = {};
  function pic(e){
    if (!pics[e]){
      const c = document.createElement('canvas'); c.width = c.height = 256;
      const g = c.getContext('2d');
      g.font = '200px "Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif';
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(e, 128, 140);
      pics[e] = c.toDataURL();
    }
    return pics[e];
  }

  let R = null;
  function newRound(){
    R = { at: 0, ok: 0, total: prefs.count };
    $('#qt').textContent = R.total;
    const st = $('#stars'); st.textContent = '';
    for (let i = 0; i < R.total; i++) st.appendChild(document.createElement('i'));
    $('#done').hidden = true; $('#menu').hidden = true;
    question();
  }
  function question(){
    const L = LEVEL[prefs.level], n = L.cols*L.rows, kind = pick(L.kinds);
    let same, odd, oddStyle = '';
    const either = p => Math.random() < .5 ? p : [p[1], p[0]];
    if (kind === 'mid') [same, odd] = either(pick(FACES_MID));
    else if (kind === 'hard') [same, odd] = either(pick(FACES_HARD));
    else if (kind === 'clock'){ const i = Math.floor(Math.random()*12); [same, odd] = either([CLOCKS[i], CLOCKS[(i + 1) % 12]]); }
    else if (kind === 'color'){ same = odd = pick(SOLO); oddStyle = `filter:hue-rotate(${L.hue + Math.round(Math.random()*10)}deg)`; }
    else if (kind === 'flip'){ same = odd = pick(FACING); oddStyle = 'transform:scaleX(-1)'; }
    else if (kind === 'size'){ same = odd = pick(SOLO); oddStyle = `transform:scale(${L.size})`; }
    else { same = odd = pick(FACING.concat(SOLO)); oddStyle = `transform:rotate(${Math.random() < .5 ? -L.turn : L.turn}deg)`; }
    R.q = { n, ans: Math.floor(Math.random()*n), miss: 0 };
    $('#qn').textContent = R.at + 1;
    grid.textContent = '';
    for (let i = 0; i < n; i++){
      const b = document.createElement('button');
      b.className = 'cell'; b.type = 'button'; b.dataset.i = i;
      b.innerHTML = `<img alt="" draggable="false" src="${pic(i === R.q.ans ? odd : same)}" style="${i === R.q.ans ? oddStyle : ''}">`;
      b.setAttribute('aria-label', '그림 ' + (i+1));
      grid.appendChild(b);
    }
    R.q.busy = false;
    Z = { s: 1, x: 0, y: 0 };
    layout();
  }
  grid.addEventListener('click', e => {
    if (dragged){ dragged = false; return; } // 확대·끌기한 손가락을 뗀 것은 누른 것이 아님
    const b = e.target.closest('.cell');
    if (!b || !R || R.q.busy) return;
    wakeAudio();
    const i = +b.dataset.i;
    if (i === R.q.ans){
      R.q.busy = true;
      b.classList.add('right');
      [659, 880].forEach((f, k) => setTimeout(() => beep(f, .14), k*120));
      $('#stars').children[R.at].classList.add(R.q.miss ? 'slow' : 'ok');
      if (!R.q.miss) R.ok++;
      setTimeout(() => { if (++R.at < R.total) question(); else finish(); }, 1100);
    } else {
      R.q.miss++;
      b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong');
      beep(220, .15);
      // 두 번 틀리면 정답에 노란 점선 테두리
      if (R.q.miss >= 2) grid.children[R.q.ans].classList.add('hint');
    }
  });
  function finish(){
    [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, .18), i*110));
    $('#dScore').textContent = `${R.total}문제 중 ${R.ok}개를 한 번에 찾았어요`;
    $('#done').hidden = false;
  }

  // 화면에 가장 크게 들어가는 줄·칸
  function layout(){
    if (!R || !R.q) return;
    // 판은 늘 가로로 정해진 줄·칸 (세로 화면이면 앱 전체가 돌아가 있다)
    const W = stage.clientWidth, H = stage.clientHeight, L = LEVEL[prefs.level], top = 78, pad = 12;
    const cols = L.cols, rows = L.rows;
    const gap = Math.round(Math.max(4, Math.min(W, H)*.008));
    // 판이 화면 가로·세로를 꽉 채운다 — 칸은 가로로 길어질 수 있고, 그림은 칸의 짧은 쪽에 맞춘다
    const cw = Math.floor((W - 2*pad - gap*(cols+1))/cols), ch = Math.floor((H - top - pad - gap*(rows+1))/rows);
    const gw = cols*cw + gap*(cols+1), gh = rows*ch + gap*(rows+1);
    grid.style.setProperty('--gap', gap + 'px');
    grid.style.setProperty('--s', Math.floor(Math.min(cw, ch)*.86) + 'px');
    grid.style.gridTemplateColumns = `repeat(${cols}, ${cw}px)`;
    grid.style.gridAutoRows = ch + 'px';
    view.style.left = Math.round((W - gw)/2) + 'px';
    view.style.top = Math.round(top + (H - top - pad - gh)/2) + 'px';
    view.style.width = gw + 'px'; view.style.height = gh + 'px';
    applyZoom();
  }

  // ---------- 확대: 두 손가락으로 벌리면 커지고(최대 4배), 커진 동안 한 손가락으로 끌어 옮긴다 ----------
  const view = $('#view'), turned = matchMedia('(orientation: portrait)');
  let Z = { s: 1, x: 0, y: 0 }, gest = null, dragged = false;
  const pts = new Map();
  // 세로 화면이면 앱이 90도 돌아가 있으니 손가락 위치도 돌려서 본다
  const appXY = e => turned.matches ? { x: e.clientY, y: innerWidth - e.clientX } : { x: e.clientX, y: e.clientY };
  const local = p => ({ x: p.x - view.offsetLeft, y: p.y - view.offsetTop });
  function applyZoom(){
    const vw = view.clientWidth, vh = view.clientHeight;
    Z.s = Math.min(4, Math.max(1, Z.s));
    Z.x = Math.min(0, Math.max(vw - vw*Z.s, Z.x)); Z.y = Math.min(0, Math.max(vh - vh*Z.s, Z.y));
    grid.style.transform = Z.s > 1 ? `translate(${Z.x}px,${Z.y}px) scale(${Z.s})` : '';
    $('#unzoom').hidden = Z.s < 1.05;
  }
  function startGesture(){
    const ps = [...pts.values()];
    if (ps.length >= 2){
      const a = local(ps[0]), b = local(ps[1]);
      gest = { pinch: true, d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, s0: Z.s, x0: Z.x, y0: Z.y, m0: { x: (a.x + b.x)/2, y: (a.y + b.y)/2 } };
    } else if (ps.length === 1) gest = { pinch: false, x0: Z.x, y0: Z.y, p0: local(ps[0]) };
    else gest = null;
  }
  view.addEventListener('pointerdown', e => { if (!pts.size) dragged = false; pts.set(e.pointerId, appXY(e)); startGesture(); });
  view.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId) || !gest) return;
    pts.set(e.pointerId, appXY(e));
    const ps = [...pts.values()];
    if (gest.pinch && ps.length >= 2){
      const a = local(ps[0]), b = local(ps[1]), m = { x: (a.x + b.x)/2, y: (a.y + b.y)/2 };
      const s = Math.min(4, Math.max(1, gest.s0*Math.hypot(a.x - b.x, a.y - b.y)/gest.d0));
      // 처음 두 손가락 사이에 있던 그림이 손가락 사이에 그대로 있게
      const gx = (gest.m0.x - gest.x0)/gest.s0, gy = (gest.m0.y - gest.y0)/gest.s0;
      Z.s = s; Z.x = m.x - gx*s; Z.y = m.y - gy*s; dragged = true; applyZoom();
    } else if (!gest.pinch && Z.s > 1){
      const a = local(ps[0]), dx = a.x - gest.p0.x, dy = a.y - gest.p0.y;
      if (Math.hypot(dx, dy) > 10) dragged = true;
      if (dragged){ Z.x = gest.x0 + dx; Z.y = gest.y0 + dy; applyZoom(); }
    }
  });
  const lift = e => { if (pts.delete(e.pointerId)) startGesture(); };
  view.addEventListener('pointerup', lift); view.addEventListener('pointercancel', lift);
  $('#unzoom').addEventListener('click', () => { Z = { s: 1, x: 0, y: 0 }; applyZoom(); });

  // ---------- 소리 ----------
  let ac = null;
  function wakeAudio(){
    try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch(e){}
  }
  function beep(freq, dur){
    if (!prefs.sound || !ac) return;
    try {
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
      o.type = 'triangle'; o.frequency.value = freq;
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(.22, t + .006);
      g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + .02);
    } catch(e){}
  }

  // ---------- 설정 ----------
  const toggle = (btn, on) => btn.setAttribute('aria-pressed', on ? 'true' : 'false');
  function syncSeg(){
    for (const b of $('#level').querySelectorAll('[data-v]')) toggle(b, +b.dataset.v === prefs.level);
    for (const b of $('#count').querySelectorAll('[data-v]')) toggle(b, +b.dataset.v === prefs.count);
  }
  $('#level').addEventListener('click', e => {
    const b = e.target.closest('[data-v]');
    if (!b || +b.dataset.v === prefs.level) return;
    prefs.level = +b.dataset.v; savePrefs(); syncSeg(); newRound();
  });
  $('#count').addEventListener('click', e => {
    const b = e.target.closest('[data-v]');
    if (!b || +b.dataset.v === prefs.count) return;
    prefs.count = +b.dataset.v; savePrefs(); syncSeg(); newRound();
  });
  $('#sound').addEventListener('click', e => { prefs.sound = !prefs.sound; savePrefs(); toggle(e.currentTarget, prefs.sound); if (prefs.sound){ wakeAudio(); beep(660, .08); } });
  $('#again').addEventListener('click', newRound);
  $('#doneAgain').addEventListener('click', newRound);
  $('#gear').addEventListener('click', () => { $('#menu').hidden = false; });
  $('#menuClose').addEventListener('click', () => { $('#menu').hidden = true; });
  const fullBtn = $('#full'), fsEl = document.documentElement;
  if (!(fsEl.requestFullscreen || fsEl.webkitRequestFullscreen)) fullBtn.hidden = true;
  fullBtn.addEventListener('click', () => {
    try {
      if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else { const r = (fsEl.requestFullscreen || fsEl.webkitRequestFullscreen).call(fsEl); if (r && r.catch) r.catch(() => {}); }
    } catch(e){}
    $('#menu').hidden = true;
  });

  toggle($('#sound'), prefs.sound); syncSeg();
  new ResizeObserver(layout).observe(stage);
  newRound();
})();
</script>

<script>
  if (matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches){ const b = document.getElementById('full'); if (b) b.hidden = true; }
  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
